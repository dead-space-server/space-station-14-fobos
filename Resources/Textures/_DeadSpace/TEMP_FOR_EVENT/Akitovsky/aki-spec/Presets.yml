############ Боты с лутом
#region Gibb
- type: entity
  abstract: true
  id: NFMobNoEquipmentOnGib
  components:
  - type: GibOnTrigger
    deleteItems: true
    deleteOrgans: true
    gib: false
    useArgumentEntity: true

#region Stamina
- type: entity
  id: MobStaminaFodder
  abstract: true
  components:
  - type: Stamina
    critThreshold: 80

- type: entity
  id: MobMovementSpeedModifierRanged
  abstract: true
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 3.5

#region Inventories
- type: entity # All slots are fillable, most of them are "hidden"
  id: MobHumanoidInvetory
  abstract: true
  components:
  - type: Inventory
    templateId: hostilehumanoid # Supports loadouts
  - type: InventorySlots

- type: inventoryTemplate
  id: hostilehumanoid
  slots:
    - name: pocket1
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,0
      dependsOn: jumpsuit
      displayName: Pocket 1
      stripHidden: false

    - name: pocket2
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 1,0
      dependsOn: jumpsuit
      displayName: Pocket 2
      stripHidden: false

    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,0
      strippingWindowPos: 2,0
      dependsOn: outerClothing
      dependsOnComponents:
      - type: AllowSuitStorage
      displayName: Suit Storage

    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 9
      uiWindowPos: 1,1
      strippingWindowPos: 0,1
      displayName: Suit

    - name: belt
      slotTexture: belt
      fullTextureName: template_small
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,1
      strippingWindowPos: 1,1
      displayName: Belt

    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,0
      strippingWindowPos: 2,1
      displayName: Back
      blacklist:
        tags:
        - PetOnly

# Positions that shouldn't be strippable
# "Not strippable", "hidden":
# stripTime seems to have a hardcoded maximum value, preventing items in a slot from being completely unlootable via setting a long time
# By placing the wallet slot above the slots we want to protect, items in those covered slots become non-interactable
    - name: id
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: id
      fullTextureName: template_small
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      uiWindowPos: 2,1
      dependsOn: jumpsuit
      displayName: ID

    - name: gloves
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 2,1
      displayName: Gloves

    - name: neck
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 0,2
      displayName: Neck

    - name: mask
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,2
      displayName: Mask

    - name: eyes
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: glasses
      slotFlags: EYES
      uiWindowPos: 0,3
      displayName: Eyes

    - name: ears
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: ears
      slotFlags: EARS
      uiWindowPos: 2,2
      displayName: Ears

    - name: head
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,3
      displayName: Head

    - name: shoes
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: shoes
      slotFlags: FEET
      uiWindowPos: 1,0
      displayName: Shoes

    - name: jumpsuit
      stripTime: 999999 # "Not strippable"
      stripHidden: true
      strippingWindowPos: 2,2
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      uiWindowPos: 0,1
      displayName: Jumpsuit

- type: entity
  id: MobHumanoidHostileAISimpleRanged
  abstract: true
  components:
  - type: HTN
    rootTask:
       task: SimpleRangedHostileCompound
    blackboard:
      NavClimb: !type:Bool
        false
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        false #Lua true<false
      NavSmash: !type:Bool # They use this option too much for my liking, but I'll keep it here as an option
        true

#region NPC types
# Human NPC, uses equipment, immune to vacuum/low pressure
- type: entity
  save: false
  suffix: AI, Hostile
  abstract: true
  parent:
  - MobAtmosStandard
  - MobMovementSpeedModifierMelee
  - MobStaminaFodder
  - MobBloodstream
  - MobFlammable
  - MobEnhancedMovement
  - BaseMobSpecies
  - BaseMobHuman
  id: MobHumanoidHostileBase
  components:
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: MobMover
  - type: StandingState
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      120: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.7
      60: 0.5
  - type: Blindable
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRotten
      amount: 2
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Vocalizer
    minVocalizeInterval: 120
    maxVocalizeInterval: 240
  - type: DatasetVocalizer
    dataset: ClownVendAds
