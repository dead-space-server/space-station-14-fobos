# ТЕХНИЧЕСКАЯ ЧАСТЬ

- type: entity
  id: SpawnSupplyEmpty
  name: SpawnSupplyEmpty
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 9.75
  - type: SpawnOnTrigger 
    proto: SpawnSupplypodAnimation
  - type: TriggerOnSpawn
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
  - type: Marker

- type: entity 
  id: SpawnSupplypodAnimation
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Uploaded/PMC/Artillery/marker.rsi
    state: marker_ping
  - type: TimedDespawn
    lifetime: 1.75
  - type: SpawnOnTrigger 
    proto: SpawnSupplypodStartAnimationSound
  - type: TriggerOnSpawn
  - type: SpawnOnDespawn
    prototype: SpawnSupplypodPermaMarkerAnimation
  - type: Tag
    tags:
    - HideContextMenu
    
- type: entity
  id: SpawnSupplypodPermaMarkerAnimation
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Uploaded/PMC/Artillery/marker.rsi
    state: marker
  - type: TimedDespawn
    lifetime: 2
  - type: SpawnOnTrigger 
    proto: SpawnSupplypodLandingAnimation
  - type: TriggerOnSpawn
  - type: Tag
    tags:
    - HideContextMenu     
    
- type: entity
  id: SpawnSupplypodStartAnimationSound
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnTrigger
    sound:
      path: /Uploaded/PMC/Artillery/supplypodlandig.ogg
      maxDistance: 5
  - type: TriggerOnSpawn
    
- type: entity
  id: SpawnSupplypodLandingAnimation
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Uploaded/PMC/Artillery/landingpod.rsi
    state: landing
    offset: -1.7, 4.3
  - type: TimedDespawn
    lifetime: 1.8
  - type: SpawnOnDespawn
    prototype: SpawnSupplypodLanded
  - type: Tag
    tags:
    - HideContextMenu     

- type: entity
  id: SpawnSupplypodLanded
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: SmokeOnTrigger
    duration: 3
    spreadAmount: 1
  - type: Sprite
    offset: 0, 0.25
    sprite: /Uploaded/PMC/Artillery/supplypod.rsi
    state: landed
  - type: TimedDespawn
    lifetime: 6
  - type: SpawnOnDespawn 
    prototype: SpawnSupplypodLandedOpening
  - type: Tag
    tags:
    - HideContextMenu     

- type: entity
  id: SpawnSupplypodLandedOpening
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    offset: 0, 0.25
    sprite: /Uploaded/PMC/Artillery/supplypod.rsi
    state: landed-opened
  - type: TimedDespawn
    lifetime: 4
  - type: SpawnOnDespawn 
    prototype: SpawnSupplypodWooshSound
  - type: EmitSoundOnTrigger 
    sound:
      path: /Uploaded/PMC/Artillery/closet_open.ogg
      maxDistance: 5
  - type: TriggerOnSpawn
  - type: Tag
    tags:
    - HideContextMenu     

- type: entity
  id: SpawnSupplypodWooshSound
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnTrigger
    sound:
      path: /Uploaded/PMC/Artillery/podwoosh.ogg
      maxDistance: 5
  - type: TriggerOnSpawn
  - type: TimedDespawn
    lifetime: 3
# КОНЕЦ ТЕХНИЧЕСКОЙ ЧАСТИ

- type: entity
  name: вызов припасов - China Lake
  description: Eeeeeeeeeeeeeeeeeeeeee.
  parent: [ GrenadeBase, BaseSecurityContraband ]
  id: RatioSupplyChina
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/flashbang.rsi
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: "/Audio/Effects/flash_bang.ogg"
    positional: true
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: SpawnSupplyChinalake
    predicted: true
  - type: Appearance

- type: entity
  id: SpawnSupplypodRocketAnimation
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Uploaded/PMC/Artillery/landingrocket.rsi
    state: landing
    offset: 0, 4.3
  - type: TimedDespawn
