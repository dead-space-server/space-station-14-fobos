# Снаряжение


- type: entity
  parent: BaseItem
  id: Angorcombathypo
  name: Гипоспрей Эп-1
  description: Модель гипоспрея произведённая Частной Военной Корпорацией "Ангор". Данная технология была "вежливо" позаимствована во время одного из налётов.
  components:
  - type: Sprite
    sprite: /Uploaded/ANGOR/AngorHypo.rsi
    state: icon
  - type: Item
    sprite: /Uploaded/ANGOR/AngorHypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 45
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: UseDelay
    delay: 1.0


