# BoneGel

- type: entity
  id: BoneGelBase
  parent: BaseToolSurgery
  abstract: true
  components:
  - type: BoneGel
    speed: 1.0
    startSound:
      path: /Audio/Items/Medical/ointment_begin.ogg
    endSound:
      path: /Audio/Items/Medical/ointment_end.ogg
  - type: SurgeryTool
  - type: Tag
    tags:
    - BoneGel
  - type: SolutionContainerManager
    solutions:
      container:
        maxVol: 30
  - type: MixableSolution
    solution: container
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: DrawableSolution
    solution: container
  - type: RefillableSolution
    solution: container
  - type: DrainableSolution
    solution: container
  - type: ExaminableSolution
    solution: container
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface

- type: entity
  name: bottle of bone gel
  id: BoneGel
  parent: BoneGelBase
  description: A container for bone gel that often needs to be refilled from a specialized machine.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel
  - type: SolutionContainerManager
    solutions:
      container:
        maxVol: 30
        reagents:
        - ReagentId: BoneGel
          Quantity: 30

- type: entity
  name: abductor's bottle of bone gel
  id: BoneGelAbductor
  parent: BoneGel
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: abductor
  - type: SolutionRegeneration
    solution: container
    generated:
      reagents:
      - ReagentId: BoneGel
        Quantity: 1

# Abductor tools

- type: entity
  name: abductor's retractor
  id: RetractorAbductor
  parent: Retractor
  description: A surgical tool used to hold open incisions.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: abductor-retractor
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    storedRotation: 45
  - type: Retractor
    speed: 0.4
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/retractor2.ogg

- type: entity
  name: abductor's circular saw
  id: SawAbductor
  parent: SawElectric
  description: You think you can cut anything with it.
  components:
  - type: Sprite
    state: abductor
  - type: Tool
    speedModifier: 0.4
  - type: BoneSaw
    speed: 0.1
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/saw.ogg
    endSound:
      path: /Audio/Items/drill_hit.ogg

- type: entity
  name: abductor's cautery
  id: CauteryAbductor
  parent: Cautery
  components:
  - type: Sprite
    state: abductor
  - type: Cautery
    speed: 0.5

- type: entity
  name: abductor's hemostat
  id: HemostatAbductor
  parent: Hemostat
  description: A surgical tool used to compress blood vessels to prevent bleeding.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: abductor-hemostat
  - type: Hemostat
    speed: 0.4

- type: entity
  name: abductor's bone setter
  id: BoneSetterAbductor
  parent: BoneSetter
  description: A surgical tool used for setting bones. It also breaks them quite well.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: abductor-setter
  - type: Item
    heldPrefix: setter
    storedRotation: 45
  - type: BoneSetter
    speed: 0.4
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/bone_setter.ogg

- type: entity
  name: abductor's scalpel
  id: ScalpelAbductor
  parent: Scalpel
  components:
  - type: Sprite
    state: abductor
  - type: Scalpel
    speed: 0.2

- type: entity
  name: abductor's drill
  id: DrillAbductor
  parent: Drill
  components:
  - type: Sprite
    state: abductor
  - type: SurgicalDrill
    speed: 0.5

# Debug

- type: entity
  name: Super Amazing All In One Surgery Stick
  id: DebugStickSurgery
  parent: BoneGelBase
  description: A stick.
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Decoration/Flora/Abyss/obelisk.rsi
    state: obelisk01
  - type: SurgeryTool
  - type: Scalpel
  - type: Cautery
  - type: SurgicalDrill
  - type: Hemostat
  - type: Retractor
  - type: BoneSaw
  - type: BoneSetter
  - type: SolutionRegeneration
    solution: container
    generated:
      reagents:
      - ReagentId: BoneGel
        Quantity: 1
