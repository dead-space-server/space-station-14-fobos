- type: entity
  id: ActionHeraldEnrage
  name: Впасть в бешенство
  description: Вы сильно злы! Ваша скорость увеличена.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    icon:
      sprite: _DeadSpace/Demons/demon_boss.rsi
      state: herald
  - type: InstantAction
    event: !type:HeraldEnrageActionEvent

- type: entity
  id: ActionHeraldSpawn
  name: Открыть портал
  description: Открывает портал в ад, и да начнётся нашествие демонов!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _DeadSpace/Demons/demon_boss.rsi
      state: herald
  - type: InstantAction
    event: !type:HeraldSpawnActionEvent

- type: entity
  id: ActionStunAttack
  name: Оглушающая атака
  description: Ваша следующая атака собьёт жертву с ног.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_damtype_brute
  - type: InstantAction
    event: !type:StunAttackActionEvent

- type: entity
  id: ActionStunRadius
  name: Шутка
  description: Заставляет всех вокруг упасть со смеху.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: Objects/Specific/Mech/mecha_equipment.rsi
      state: mecha_honker
  - type: InstantAction
    event: !type:StunRadiusActionEvent

- type: entity
  id: ActionDemonDash
  name: Демонический рывок
  description: Телепортирует вас в указанную точку.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
    itemIconStyle: NoItem
    priority: -1
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:DemonDashEvent

- type: entity
  id: ActionDemonShadowGrapple
  name: Притянуть существо
  description: Оглушает и притягивает выбранное существо.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    icon: _DeadSpace/Demons/ability_icons/shadow_grapple.png
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: EntityTargetAction
    event: !type:ShadowGrappleEvent

- type: entity
  id: ActionLockShadowCocoon
  name: Засунуть в кокон
  description: Помещает существо в теневой кокон.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: _DeadSpace/Demons/shadow_cocoon.rsi
      state: cocoon
  - type: TargetAction
    checkCanAccess: false
    range: 3
  - type: EntityTargetAction
    event: !type:LockCocoonEvent

- type: entity
  id: ActionDemonShadowCrawl
  name: Войти в астрал
  description: Вы исчезаете из физического мира.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _DeadSpace/Demons/ability_icons/shadow_crawl.png
    itemIconStyle: NoItem
    useDelay: 60
  - type: InstantAction
    event: !type:ShadowCrawlActionEvent

- type: entity
  id: ActionShadowlingVeil
  name: Пелена
  description: Вызывает всплеск аномальной энергии, поглощающей ближайшие источники света.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/veil_action.png
    useDelay: 20
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ShadowlingVeilActionEvent

- type: entity
  id: ActionShadowlingPhase
  name: Теневой шаг
  description: Позволяет вам быстро перемещаться сквозь стены.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadow_ghost_action.png
    useDelay: 40
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ShadowlingPhaseActionEvent

- type: entity
  id: ActionShadowlingRecruit
  name: Порабощение
  description: Позволяет превратить члена экипажа в слугу.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_recruit_action.png
    useDelay: 5
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ShadowlingRecruitEvent

- type: entity
  id: ActionShadowlingDarkMind
  name: Разум тьмы
  description: Позволяет узнать количество слуг тенеморфов на станции.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_dark_mind_action.png
    useDelay: 5
  - type: InstantAction
    event: !type:ShadowlingDarkMindEvent

- type: entity
  id: ActionShadowlingReveal
  name: Раскрытие
  description: Принять истинную форму Тенеморфа.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_reveal_action.png
    useDelay: 30
  - type: InstantAction
    event: !type:ShadowlingRevealEvent

- type: entity
  id: ActionShadowlingAscendance
  name: Превознесение
  description: Превозносит вас, делая Вознесённым, повышая ваши характеристики
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_exalt_action.png
    useDelay: 30
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ShadowlingAscendanceEvent

- type: entity
  id: ActionShadowlingBlink
  name: Оцепенение.
  description: Оглушает одиночную цель.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_blink_action.png
    useDelay: 40
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    event: !type:ShadowlingBlinkEvent

- type: entity
  id: ActionShadowlingScreech
  name: Волна визга
  description: Оглушить всех в радиусе 5 метров.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_screech_action.png
    useDelay: 90
  - type: InstantAction
    checkCanInteract: true
    event: !type:ShadowlingScreechEvent

- type: entity
  id: ActionShadowlingAnnihilation
  name: Аннигиляция
  description: Разрывает цель на органы.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_annihilation_action.png
    useDelay: 20
    itemIconStyle: NoItem
  - type: TargetAction
    range: 3
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ShadowlingAnnihilationEvent

- type: entity
  id: ActionShadowlingBlackMed
  name: Черная медицина
  description: Мгновенно воскрешает и полностью исцеляет вашего слугу.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_blackmed_action.png
    useDelay: 180
    itemIconStyle: NoItem
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false # На себя не работает, только на рабов
    event: !type:ShadowlingBlackMedEvent

- type: entity
  id: ActionShadowlingFreezingVeins
  name: Стынущие жилы
  description: Замораживает вашу жертву.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_freezing_veins_action.png
    useDelay: 80
    itemIconStyle: NoItem
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ShadowlingFreezingVeinsEvent

- type: entity
  id: ActionShadowlingSmoke
  name: Дымовая завеса
  description: Выпускает облако густого дыма, скрывающее ваше присутствие.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_smoke_action.png
    useDelay: 50
  - type: InstantAction
    event: !type:ShadowlingSmokeActionEvent

- type: entity
  id: ActionShadowlingThunderstorm
  name: Грозовой шторм
  description: Поражает врагов цепной молнией.
  components:
  - type: Action
    icon: _DeadSpace/Demons/shadowling.rsi/shadowling_thunderstorm_action.png
    useDelay: 25
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ShadowlingThunderstormEvent
