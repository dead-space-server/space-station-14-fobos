- type: reaction
  id: Fragmentin
  reactants:
    Phalanximine:
      amount: 2
    Ultravasculine:
      amount: 1
    Aluminum:
      amount: 1
  products:
    Fragmentin: 1

- type: reagent
  id: Fragmentin
  name: reagent-name-Fragmentin
  group: Medicine
  desc: На вид липкое. Пахнет тиной.
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color:  "#73e65f"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: -3
            Radiation: 5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10
        damage:
          types:
            Radiation: 5
      - !type:ReagentThreshold
          min: 15
      Poison:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 10
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: Arithrazine
          min: 1
        damage:
          types:
            Caustic: 0.5
            Brute: 0.3
          metabolisms: 0.5

- type: reaction
  id: Actiradol
  reactants:
    Cryoxadone:
      amount: 2
    Arithrazine:
      amount: 1
    Siderlac:
      amount: 1
  products:
    Actiradol: 1

- type: reagent
  id: Actiradol
  name: reagent-name-Actiradol
  group: Medicine
  desc: На вид шершавое. Пахнет кисло.
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color:  "#FF9218"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
        - !type:MobStateCondition
          mobstate: Dead
          damage:
            types:
            Radiation: -3
        - !type:HealthChange
          conditions:
          - !type:Temperature
            # this is a little arbitrary but they gotta be pretty cold
            max: 213.0
