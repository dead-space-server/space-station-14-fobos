- type: reaction
  id: Fragmentin
  reactants:
    Phalanximine:
      amount: 2
    Ultravasculine:
      amount: 1
    Aluminum:
      amount: 1
  products:
    Fragmentin: 1

- type: reagent
  id: Fragmentin
  name: reagent-name-Fragmentin
  group: Medicine
  desc: На вид липкое. Пахнет тиной.
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color:  "#73e65f"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: -3
            Radiation: 5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10
        damage:
          types:
            Radiation: 5
      - !type:ReagentThreshold
          min: 15
      Poison:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 10
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          reagent: Arithrazine
          min: 1
        damage:
          types:
            Caustic: 0.5
            Brute: 0.3
          metabolisms: 0.5

- type: reaction
  id: Actiradol
  reactants:
    Cryoxadone:
      amount: 2
    Arithrazine:
      amount: 1
    Siderlac:
      amount: 1
  products:
    Actiradol: 1

- type: reagent
  id: Actiradol
  name: reagent-name-Actiradol
  group: Medicine
  desc: На вид шершавое. Пахнет кисло.
  physicalDesc: reagent-physical-desc-acrid
  flavor: medicine
  color:  "#FF9218"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
        - !type:MobStateCondition
          mobstate: Dead
          damage:
            types:
            Radiation: -3
        - !type:HealthChange
          conditions:
          - !type:Temperature
            # this is a little arbitrary but they gotta be pretty cold
            max: 213.0

- type: reaction
  id: Sentidol
  reactants:
    Mannitol:
      amount: 3
    Mercury:
      amount: 1
    Fluorine:
      amount: 1
  products:
    Sentidol: 1

- type: reagent
  id : Sentidol
  name: Сентидол
  group: Medicine
  desc: Мягкий аксиолитик. Оказывает легкое, седативное, расслабляющее воздействие на организм. Часто используется на пациентах страдающих от разных форм инсомнии, эпилепсии, панических атак и частой тревожности. Примечание - передозировка препаратом вызывает спазматический эффект, распространяющийся в основном на мышцы лица.
  physicalDesc: на вид жгучее, пахнет измельченной солодкой.
  flavor: sweet
  color: "#57356a"
  metabolisms:
    Medicine:
     metabolismRate: 0.5
     effects:
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          min: 2.5
        type: Local
        visualType: Medium
        messages: [ "Вы ощущаете меланхоличное спокойствие царящее вокруг вас" ]
        - !type:ReagentThreshold
          min: 5
        type: Local
        visualType: Medium
        messages: [ "Вы чувствуете, как ваше тело расслабляется на волнах покоя" ]
        - !type:ReagentThreshold
          min: 15
        - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Add
        type: Local
        visualType: Medium
        messages: [ "Ваше тело обессилено, вы чувствуете, как вас обволакивает сон " ]
        - !type:ReagentThreshold
          min: 20
        - !type:Jitter
        type: Local
        visualType: Medium
        messages: [ "Ваши мышцы сводит спазм, неконтролируемая улыбка проявляется на вашем лице" ]
      - !type:ReagentThreshold
         effects:
          min: 20
          damage:
            types:
             Poison : 5
            metabolismRate: 5

