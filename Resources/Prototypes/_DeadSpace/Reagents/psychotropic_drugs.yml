# Sentidol - Anxiolytic
- type: reagent
  id: Sentidol
  name: reagent-name-sentidol
  group: Medicine
  desc: reagent-desc-sentidol
  physicalDesc: reagent-physical-desc-pungent
  flavor: medicine
  color: "#57356a"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 2.5
          max: 5
        type: Local
        visualType: Small
        messages: ["--Вы ощущаете меланхоличное спокойствие царящее вокруг вас."]
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 5
          max: 15
        type: Local
        visualType: Small
        messages: ["--Вы чувствуете, как ваше тело расслабляется на волнах покоя."]
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 15
          max: 20
        type: Local
        visualType: Small
        messages: ["--Ваше тело обессилено, вы чувствуете, как вас обволакивает сон"]
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 15
        effectProto: StatusEffectDrowsiness
        time: 4
        type: Update
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
        type: Local
        visualType: MediumCaution
        messages: ["--Ваши мышцы сводит спазм, неконтролируемая улыбка проявляется на вашем лице."]
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Sentidol
          min: 20
        damage:
          types:
            Poison: 0.37

# Gliomorphin - Neuroleptic
- type: reagent
  id: Gliomorphin
  name: reagent-name-gliomorphin
  group: Narcotics
  desc: reagent-desc-gliomorphin
  physicalDesc: reagent-physical-desc-acrid
  flavor: bitter
  color: "#FF7514"
  metabolisms:
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 5
          max: 7
        type: Local
        visualType: Small
        messages: ["--Вы чувствуете, как ваш разум погружается в слабую дымку собственных мыслей"]
      - !type:EyeDamage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 5
          max: 7
        amount: 3
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 7
          max: 15
        type: Local
        visualType: Small
        messages: ["--Ваш разум словно погряз в зябком песке. Сознание притупляется..."]
      - !type:EyeDamage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 7
          max: 15
        amount: 6
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 15
          max: 16
        type: Local
        visualType: Small
        messages: ["--Вы ощущаете звонкую боль у висков. Она нагнетает. Вам неприятно."]
      - !type:EyeDamage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 15
        amount: 9
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 16
        type: Local
        visualType: MediumCaution
        messages: ["--Вас переполняет слепая ярость. Вам хочется метать все, крушить и ломать. Никто не вправе вас остановить!"]
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Gliomorphin
          min: 16
        key: TemporaryBlindness
        component: TemporaryBlindness
      - !type:Emote
        emote: Scream
        showInChat: true
        probability: 0.1
      - !type:ModifyKnockdown
        time: 2
        type: Remove
      - !type:ModifyParalysis
        time: 2
        type: Remove

# Illumidol - Nootropic psychostimulant
- type: reagent
  id: Illumidol
  name: reagent-name-illumidol
  group: Narcotics
  desc: reagent-desc-illumidol
  physicalDesc: reagent-physical-desc-airy
  flavor: bitter
  color: "#7c59c2"
  metabolisms:
    Narcotic:
      metabolismRate: 0.5
      effects:
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Illumidol
          min: 5
          max: 10
        type: Local
        visualType: Small
        messages: ["--Ваш разум тускнеет. Вы ощущаете небольшое головокружение, пытаясь разглядеть образы, которые мелькают перед вами."]
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Illumidol
          min: 10
        type: Local
        visualType: Small
        messages: ["--Ваше тело дрожит, зрачки сильно расширяются, картинка мелькает перед вами."]
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Illumidol
          min: 10
        time: 10
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Illumidol
          min: 10
        time: 10
        amplitude: 15
        frequency: 6
      - !type:Vomit
        probability: 0.3
        conditions:
        - !type:ReagentCondition
          reagent: Illumidol
          min: 10

