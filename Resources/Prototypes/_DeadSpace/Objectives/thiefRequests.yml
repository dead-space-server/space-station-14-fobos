# DS14-start
# Pool of goods the ВорПРО program requests from thieves.
# Groups are taken from the old thief steal objectives (items and collections only —
# structures and animals cannot be delivered to a beacon).
# PricePerItem is in dirty credits and is roughly tied to the objective difficulty.
# TimeLimitMinutes is the delivery window: delivering in time grants a bonus,
# being late reduces the payout (see ThiefPdaProgramComponent multipliers).

# Collections (easy money, several copies needed)
- type: thiefRequestGroup
  id: ThiefRequestHeadCloak
  group: HeadCloak
  weight: 1
  minCount: 2
  maxCount: 4
  pricePerItem: 3500
  timeLimitMinutes: 20

