- type: entity
  parent: BookBase
  id: BookStar
  suffix: звёздные войны, империя, bog333
  name: Если вы штурмовик ПРОЧИТАЙТЕ ЭТО!!!
  description: ОЧЕНЬ полезное руководство штурмовика.
  components:
  - type: Paper
    content: |
            Руководство правильного штурмовика.
            
            1. Вы-имперский штурмовик не клон.
            2. Вы ОБЯЗАНЫ выполнять ВСЕ приказы вышестоящих должностных лиц таких, как Капитан (красный наплечник); Лейтенант (оранжевый наплечник); Сержант (белый наплечник); капрал (чёрный наплечник), ну и лордам разумеется. (дартам) Даже если их приказы противоречат вашей логике и вашим хотелкам вы ОБЯЗАНЫ выполнить их приказ не смотря не на что.
            3. Штурмовики, оспаривающие приказы, сомневающиеся в них или отказывающиеся их выполнять ждёт серьёзное наказание, вплоть до лишения жизни.
            4. Если вы видите, как штурмовик нарушает прямой приказ вышестоящего должностного лица вы обязаны остановить его любой ценой, вплоть до ликвидации.

            Рекомендации (инструкция)

            1. Световая винтовка не имеет перезарядки расходуйте заряды (15) с умом. Для повышенной точности рекомендуется стрелять с двух рук.
            2. Привяжите свой скафандр к своему днк. Так враг не сможет завладеть вашим скафандром.
            3. НИ ЗА ЧТО, НИ ПРИ КАКИХ ОБСТОЯТЕЛЬСТВАХ НЕ СНИМАЙТЕ ЧЁРНЫЙ КОМБИНЕЗОН!!!!!!! Если вы его снимите то потеряете неснимаемую айди карту
            4. У вас в рюкзаке есть имплант рации. Вколите его чтобы разговаривать и слышать других штурмовиков. Его частота на букву ш

- type: entity
  name: Высокотехнологичный огнемёт
