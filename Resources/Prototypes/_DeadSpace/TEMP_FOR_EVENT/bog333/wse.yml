- type: entity
  id: ShuttleGunSvalinnMachineGunStar
  parent: [ ShuttleGunBase, ConstructibleMachine]
  name: Лазерное орудие шаттла
  description: Оно... оно прекрасно! Самозарядка перестала работать из за перемещения в другую вселенную. Стреляет ОЧЕНЬ мощным зарядом света, который запросто может прожечь любою стену! А ещё в него встроена система регулирования давления, что позволяет ему работать, как маленький вентилятор. PS повреждения других шаттлов вы не увидите на сканера масс ибо он не ломает плитки. 
  suffix: звёздные войны, империя, bog333
  components:
  - type: Sprite
    sprite: /Textures/_DeadSpace/TEMP_FOR_EVENT/bog333/StarWars/orydie.rsi
    layers:
    - state: lse-1200c
    - state: mag-unshaded-9
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      gun_magazine: !type:ContainerSlot  # Этот слот, возможно, понадобится для хранения батареи, если она не встроена
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    fireRate: 0.5
    useKey: false
    soundGunshot:
      path: /Audio/_DeadSpace/TEMP_FOR_EVENT/bog333_audio/myzika/blaster.ogg
      params:
        variation: 0.05
    projectileSpeed: 50  # <-- Добавьте projectileSpeed, если его еще нет! Начните с малого значения!
  - type: MagazineVisuals
    magState: mag
    steps: 10
    zeroVisible: true
  - type: Machine
    board: ShuttleGunSvalinnMachineGunCircuitboard
  - type: BatteryAmmoProvider
    proto: HeavyLaserG # Указываем на снаряд HeavyLaserG
    fireCost: 50  # Стоимость выстрела (энергия)  МЕНЯЕМ!
  - type: Battery # Добавляем компонент Battery
    maxCharge: 5000 #  Изменяем максимальный заряд
    startingCharge: 5000  # Изменяем стартовый заряд
  - type: Airtight  # <-- Добавляем компонент Airtight
    noAirWhenFullyAirBlocked: false # <-- Указываем, что воздух должен блокироваться

