  description: Высокотехнологичный щит штурмовика хорошо защищающий от лазеров.
  components:
    - type: Sprite
      sprite: /Textures/_DeadSpace/TEMP_FOR_EVENT/bog333/StarWars/shield.rsi
      state: icon
    - type: Item
      sprite: /Textures/_DeadSpace/TEMP_FOR_EVENT/bog333/StarWars/shield.rsi
      heldPrefix: icon
    - type: Reflect
      reflectProb: 0.95
    - type: Blocking #Mirror shield reflects heat/laser, but is relatively weak to everything else.
      passiveBlockModifier:
        coefficients:
          Blunt: 0.2
          Slash: 0.2
          Piercing: 0.35
          Heat: 0.7
      activeBlockModifier:
        coefficients:
          Blunt: 0.2
          Slash: 0.2
          Piercing: 0.9
          Heat: 0.6
        flatReductions:
          Heat: 1
      blockSound: !type:SoundPathSpecifier
        path: /Audio/Effects/glass_step.ogg
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
