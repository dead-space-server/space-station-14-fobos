  suffix: звёздные войны, империя, bog333
  description: Уничтожте повстанцев и все ксенорассы!
  components:
  - type: Sprite
    sprite: /Textures/_DeadSpace/TEMP_FOR_EVENT/bog333/StarWars/ognemet.rsi
    layers:
    - state: fire_extinguisher_closed
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: /Textures/_DeadSpace/TEMP_FOR_EVENT/bog333/StarWars/ognemet.rsi
    size: Normal
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 1500
        reagents:
        - ReagentId: Phlogiston
          Quantity: 5000
        - ReagentId: Napalm
          Quantity: 5000
        - ReagentId: Thermite
          Quantity: 5000
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 100
    transferAmount: 100
  - type: UseDelay  
    delay: 4 # <-- ЗАДЕРЖКА МЕЖДУ ИСПОЛЬЗОВАНИЯМИ (в секундах)
  - type: Spray
    transferAmount: 20
    pushbackAmount: 5
