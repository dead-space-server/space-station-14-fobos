# Катридж 9x39SP6
- type: entity
  id: CartridgeBullet9x39SP6
  name: патрон (9х39 мм СП-6)
  parent: BaseCartridgeCaselessRifle
  components:
  - type: Tag
    tags:
    - CartridgeBulletVSK
  - type: CartridgeAmmo
    proto: Bullet9x39SP6
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

# Проджектайл 9x39SP6
- type: entity
  id: Bullet9x39SP6
  parent: BaseBullet
  name: патрон (9х39 мм СП-6)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
       Piercing: 60
  - type: TimedDespawn
    lifetime: 4

# Коробка патрон 9x39SP6
- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxVSKAki
  name: коробка патронов (9х39 мм СП-6)
  suffix: Akitovsky
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeBulletVSK
    proto: CartridgeBullet9x39SP6
    capacity: 60
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi # DS14-texture-localization
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

