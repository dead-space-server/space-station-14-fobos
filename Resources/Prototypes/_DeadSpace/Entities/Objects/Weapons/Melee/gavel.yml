- type: entity
  parent: BaseItem
  id: GavelHammer
  name: судейский молоток
  description: Порядок, порядок! Никаких бомб в моём суде!
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Melee/gavelhammer.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _DeadSpace/Objects/Weapons/Melee/gavelhammer.rsi
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.2
    damage:
      types:
        Blunt: 4
    soundHit:
      path: /Audio/_DeadSpace/Items/Gavel/gavel.ogg
      params:
        variation: 0.125
  - type: StaminaDamageOnHit
    damage: 8
  - type: DisarmMalus
  - type: GavelHammer

- type: entity
  parent: BaseItem
  id: GavelBlock
  name: подставка для молотка
  description: Стукни молотком, когда ассистенты расшумятся.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Melee/gavelblock.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _DeadSpace/Objects/Weapons/Melee/gavelblock.rsi
  - type: UseDelay
    delay: 0.6
  - type: GavelBlock
