- type: entity
  name: энергобола
  parent: Bola
  id: EnergyBola
  description: Ограничивает мобильность цели, но легко снимается.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Throwable/energybola.rsi
    state: icon
  - type: Ensnaring
    freeTime: 1.0
    breakoutTime: 1.5 #all bola should generally be fast to remove
    walkSpeed: 0.3 #makeshift bola shouldn't slow too much
    sprintSpeed: 0.3
    staminaDamage: 0 # anything but this is gamebreaking
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
