- type: entity
  id: MechEquipmentTaipanRipleyGrabber
  parent: BaseMechEquipment
  name: синди-клешня
  description: Гидравлическая клешня, созданная с применением редспейс-технологий. Имеет повышенную вместимость и стильную кроваво-красную расцветку.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_clamp
  - type: Item
    sprite: _DeadSpace/Objects/Specific/Mech/mecha_equipment.rsi
    size: Ginormous
  - type: MechGrabber
    maxContents: 20
    grabDelay: 1.5
    grabEnergyDelta: -50
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container
  - type: Tag
    tags:
    - TaipanRipleyEquipment

- type: entity
  id: MechEquipmentCollector
  parent: BaseMechEquipment
  name: механический сборщик руды
  description: Устройство для сбора руды.
  components:
  - type: Sprite
    state: mecha_clamp
  - type: Item
  - type: MultiHandedItem
  - type: MechCollector
    range: 1.6
    scanInterval: 1
    collectEnergyDelta: -10
    whitelist:
      tags:
      - Ore
      - ArtifactFragment
  - type: Storage
    grid:
    - 0,0,15,5
    quickInsert: false
    areaInsert: false
    showVerb: false
    maxItemSize: Normal
    whitelist:
      tags:
      - Ore
      - ArtifactFragment
  - type: Dumpable
