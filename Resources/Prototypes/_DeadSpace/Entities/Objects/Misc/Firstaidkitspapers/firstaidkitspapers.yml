- type: entity
  name: инструкция по содержимому
  parent: Paper
  id: FirstAidPaperToxin
  description: Лист бумаги из аптечки.
  suffix: Отравление
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
    content: paper-aid-instruction-Toxin

