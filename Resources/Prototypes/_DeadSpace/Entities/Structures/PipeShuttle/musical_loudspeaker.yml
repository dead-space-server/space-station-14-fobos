- type: entity
  parent: BaseWallmountMachine
  id: MusicalLoudspeaker
  name: музыкальный динамик
  description: Динамик воспроизводящий музыку с завода, обычно используется для музыки в лифтах.
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _DeadSpace/Structures/Wallmounts/musical_loudspeaker.rsi
    state: base
  - type: Appearance
  - type: AmbientSound
    enabled: true
    range: 12
    volume: -4
    sound:
      path: /Audio/_DeadSpace/Music/_IvanKuvalda/Prima.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Electrified
    enabled: false
    usesApcPower: true
