- type: entity
  parent: BaseWallmountMachine
  id: MusicalLoudspeaker
  name: музыкальный динамик
  description: Настенный динамик с передатчиком, гонящим заводской плейлист по всей комнате.
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _DeadSpace/Structures/Wallmounts/musical_loudspeaker.rsi
    state: base
  - type: Appearance
  - type: MusicalLoudspeaker
    range: 12
    volume: -2
    songs:
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/dreamisland.ogg
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/haircutsformen.ogg
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/NealsRules.ogg
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/QuoVadis.ogg
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/velvet.ogg
    - path: /Audio/_DeadSpace/Music/_IvanKuvalda/french.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Electrified
    enabled: false
    usesApcPower: true
