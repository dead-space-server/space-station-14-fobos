  name: железный камень
  description: Рудная жила, богатая блюспейс кристаллами.
  suffix: Блюспейс кристал
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreBluespaceCrystal
    - type: Sprite
      sprite: _DeadSpace/Structures/Walls/rock-ore.rsi
      layers:
        - state: ironrock
        - map: [ "enum.EdgeLayer.South" ]
          state: ironrock_south
        - map: [ "enum.EdgeLayer.East" ]
          state: ironrock_east
        - map: [ "enum.EdgeLayer.North" ]
          state: ironrock_north
        - map: [ "enum.EdgeLayer.West" ]
          state: ironrock_west
        - state: rock_bluespace
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
