- type: entity
  parent: ClothingOuterHardsuitUnitologyGeist
  id: ClothingOuterHardsuitUnitologyLegion
  name: скафандр Легионера
  description: Тяжёлый трофейный скафандр бойца, завербованного Кругом на секторе СССП.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/HardSuit/legion.rsi
  - type: Clothing
    sprite: _DeadSpace/Necromorfs/TheCircle/HardSuit/legion.rsi

- type: entity
  parent: ClothingHeadHelmetUnitologyGeist
  id: ClothingHeadHelmetUnitologyLegion
  name: шлем Легионера
  description: Закрытый шлем, переживший не одну силовую вербовку.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Helmet/legion.rsi
  - type: Clothing
    sprite: _DeadSpace/Necromorfs/TheCircle/Helmet/legion.rsi

- type: entity
  parent: [ ClothingNeckBase, BaseCommandContraband ]
  id: ClothingNeckUnitologyLegionHood
  name: наплечник Легионера
  description: Опознавательный наплечник нового бойца Круга.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Gear/accessories/legion-hood.rsi
  - type: Clothing
    sprite: _DeadSpace/Necromorfs/TheCircle/Gear/accessories/legion-hood.rsi
    mappedLayer: head
  - type: HideLayerClothing
    layers:
      Hair: NECK
      HeadTop: NECK
      HeadSide: NECK

- type: entity
  parent: [ BaseKnife, BaseSyndicateContraband ]
  id: WeaponUnitologyLegionKnife
  name: нож Легионера
  description: Игнорирует защиту и возвращает владельцу часть отнятой жизни.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife-inhands.rsi
  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: 55
    resistanceBypass: true
    damage:
      types:
        Slash: 25
  - type: LegionKnife

- type: entity
  parent: UnitologyGeistPDA
  id: UnitologyLegionPDA
  suffix: Легионер
  categories: [ HideSpawnMenu ]
  components:
  - type: Pda
    id: UnitologyLegionIDCard

- type: entity
  parent: UnitologyGeistIDCard
  id: UnitologyLegionIDCard
  name: ID-карта Легионера
  suffix: Легионер
  categories: [ HideSpawnMenu ]
  components:
  - type: IdCard
    jobIcon: JobIconUnitologyLegion

- type: jobIcon
  parent: JobIcon
  id: JobIconUnitologyLegion
  icon:
    sprite: /Textures/_DeadSpace/Necromorfs/TheCircle/Mics/etc/icon.rsi
    state: circle_legion
  allowSelection: false

- type: startingGear
  parent: TheCircleBaseGear
  id: TheCircleLegionGear
  equipment:
    id: UnitologyLegionPDA
    head: ClothingHeadHelmetUnitologyLegion
    neck: ClothingNeckUnitologyLegionHood
    pocket1: WeaponUnitologyLegionKnife

- type: entity
  parent: BaseMentalAction
  id: ActionLegionRage
  name: бешенство Легионера
  description: Ускоряет Легионера на 35%. Удары продлевают бешенство, но третий удар по одной цели завершит его.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife.rsi
      state: icon
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:LegionRageActionEvent

- type: alert
  id: LegionRage
  icons:
  - sprite: /Textures/_DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife.rsi
    state: icon
  name: Бешенство Легионера
  description: Показывает оставшееся время бешенства.
