    rules: ghost-role-information-rules-default-team-antagonist
    mindRoles:
    - MindRoleBaseCircleFighters
    requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 36000 
    - !type:DepartmentTimeRequirement
      department: Security
      time: 72000 
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
  - type: ImmunNecroobelisk
  - type: IgnoreKudzu

