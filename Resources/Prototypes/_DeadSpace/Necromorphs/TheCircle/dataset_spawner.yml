- type: entity
  id: SpawnPointTheCircleFighter
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  name: "Круг"
  components:
  - type: SpawnPoint
  - type: Sprite
    layers:
    - state: green
    - sprite: _DeadSpace/Necromorfs/TheCircle/Mics/etc/uplink.rsi
      state: icon

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  id: BaseSpawnPointGhostCircle
  name: ghost role thecircle
  suffix: Круг
  parent: BaseAntagSpawner
  components:
  - type: GhostRole
    rules: ghost-role-information-rules-default-team-antagonist
    mindRoles:
    - MindRoleBaseCircleFighters
    requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 36000 
    - !type:DepartmentTimeRequirement
      department: Security
      time: 72000 
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseSpawnPointGhostCircle
  id: SpawnPointCircleCommander
  components:
  - type: GhostRole
    name: roles-antag-thecircle-commander-name
    description: roles-antag-thecircle-commander-objective
    rules: ghost-role-information-rules-default-team-antagonist
    mindRoles:
    - MindRoleCircleCommander
    requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 108000 # 30 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 72000 # 20 hours
    - !type:DepartmentTimeRequirement
      department: Command
      time: 72000 # 20 hours
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: _DeadSpace/Necromorfs/TheCircle/Mics/jobs.rsi
        state: commander

