- type: reagent
  id: ExtractInfectorMedical
  name: reagent-name-extractinfectormedical
  group: Toxins
  desc: reagent-desc-extractinfectormedical
  physicalDesc: reagent-physical-desc-thick
  color: "#d88fff"
  metabolisms:
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3
      - !type:CauseInfectionDead
        conditions:
          - !type:ReagentThreshold
            min: 15

- type: reagent
  id: Ferotohil
  name: reagent-name-ferotohil
  group: Medicine
  desc: reagent-desc-ferotohil
  physicalDesc: reagent-physical-desc-soothing
  flavor: medicine
  color: "#c1b8ff"
  metabolisms:
    Medicine:
      metabolismRate: 0.8
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -4.5
          Toxin: -4.5
          Airloss: -4.5
          Brute: -4.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 16
        damage:
          types:
            Cellular: 3

- type: reagent
  id: Punturil
  name: reagent-name-punturil
  group: Medicine
  desc: reagent-desc-punturil
  physicalDesc: reagent-physical-desc-fizzy
  flavor: fizzy
  color: "#c27676"
  metabolisms:
    Medicine:
      metabolismRate: 0.55
      effects:
      - !type:ModifyBleedAmount
        amount: -1
      - !type:HealthChange
        damage:
          types:
            Piercing: -5.3
            Slash: -1.2
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 6
        damage:
          types:
            Cellular: 2 

- type: reagent
  id: Ferratid
  name: reagent-name-ferratid
  group: Medicine
  desc: reagent-desc-ferratid
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#064457"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
           Burn: -6
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 6
        damage:
          types:
            Cellular: 2.5

- type: reagent
  id: Depotojil
  name: reagent-name-depotojil
  group: Narcotics
  desc: reagent-desc-depotojil
  physicalDesc: reagent-physical-desc-translucent
  contrabandSeverity: Major
  flavor: bitter
  color: "#FAFAFA"
  metabolisms:
    Narcotic:
      metabolismRate: 0.45
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 1.45
        sprintSpeedModifier: 1.45
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3
        type: Remove
      - !type:ModifyKnockdown
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Haloperidol
          max: 0.01
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Remove

- type: reaction
  id: Ferotohil
  reactants:
    Tricordrazine:
      amount: 1
    ExtractInfectorMedical:
      amount: 1
    Blood:
      amount: 0.1
      catalyst: true
  products:
    Ferotohil: 1.5

- type: reaction
  id: Ferratid
  reactants:
    Dermaline:
      amount: 1.5
    Pyrazine:
      amount: 1
    ExtractInfectorMedical:
      amount: 0.5
  products:
    Ferratid: 2.5

- type: reaction
  id: Punturil
  reactants:
    Puncturase:
      amount: 1.5
    ExtractInfectorMedical:
      amount: 1
    TranexamicAcid:
      amount: 0.5    
  products:
    Punturil: 2.5

- type: reaction
  id: Depotojil
  reactants:
    Ephedrine:
      amount: 1
    ExtractInfectorMedical:
      amount: 1.5
    Phenylacetone:
      amount: 1.5
  products:
    Depotojil: 3

- type: entity
  id: ExtractInfectorMedicalVial
  parent: BaseChemistryEmptyVial
  suffix: очищенный экстракт заразителя
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 30
        reagents:
        - ReagentId: ExtractInfectorMedical
          Quantity: 30
  - type: Tag
    tags: []

- type: entity
  parent: [BoxVial, BaseSyndicateContraband]
  id: ExtractInfectorMedicalKit
  name: набор очищеного экстракт заразителя
  description: Важный набор для твоего медика Круга. Кстати, скажи спасибо своему медику, ему будет приятно.
  components:
  - type: Storage
    grid:
    - 0,0,3,2
  - type: StorageFill
    contents:
    - id: Beaker
      amount: 2
    - id: ClothingEyesGlassesChemical
    - id: ExtractInfectorMedicalVial
      amount: 4

- type: entity
  parent: Jug
  id: JugTheCircle
  name: крепкий кувшин
  description: крепкий кувшин что вмещает чуть больше чем обычный кувшин, имее меньший размер. Специально сделан для бойцов Круга.
  components:
    - type: Sprite
      sprite: _DeadSpace/Necromorfs/TheCircle/Mics/etc/jug.rsi
      layers:
        - state: jug
        - state: jug1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
    - type: Item
      shape:
      - 0,0,2,1
      size: Large 
      sprite: _DeadSpace/Necromorfs/TheCircle/Mics/etc/jug.rsi
    - type: SolutionContainerManager
      solutions:
        beaker:
          maxVol: 300
