- type: reagent
  id: ExtractInfectorMedical
  name: reagent-name-extract-infector-medical
  desc: reagent-desc-extract-infector-medical
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#c27e95"
  metabolisms:
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3
      - !type:CauseInfectionDead
        conditions:
          - !type:ReagentThreshold
            min: 15

- type: reagent
  id: Depotojil
  name: reagent-name-depotojil
  desc: reagent-desc-depotojil
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#a795a3"
  metabolisms:
    Narcotic:
      metabolismRate: 1.2
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 1.45
        sprintSpeedModifier: 1.45
      - !type:Jitter
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 80
        damage:
          types:
            Poison: 1
      - !type:AdjustReagent
        conditions:
        - !type:ReagentThreshold
          reagent: ChloralHydrate
          min: 1
        reagent: ChloralHydrate
        amount: -10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3
        type: Remove
      - !type:ModifyKnockdown
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: StaminaModifier
        component: StaminaModifier
        time: 3
        type: Add
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Haloperidol
          max: 0.01
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Remove
    Medicine:
      metabolismRate: 1.2
      effects:
      - !type:ResetNarcolepsy
      - !type:HealthChange
        conditions:
        - !type:TotalDamage
          min: 70 
        damage:
          groups:
            Burn: -1
            Brute: -1

- type: reagent
  id: Ferotohil
  name: reagent-name-ferotohil
  desc: reagent-desc-ferotohil
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#b4a9ff"
  metabolisms:
    Medicine:
      metabolismRate: 0.8
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -4.5
          Toxin: -4.5
          Airloss: -4.5
          Brute: -4.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 16
        damage:
          types:
            Cellular: 3

- type: reaction
  impact: Medium
  id: Ferotohil
  reactants:
    Tricordrazine:
      amount: 1
    ExtractInfectorMedical:
      amount: 1
  products:
    Ferotohil: 1.5

- type: reaction
  id: Depotojil
  impact: Medium
  reactants:
    Ephedrine:
      amount: 1
    ExtractInfectorMedical:
      amount: 1
    Phenylacetone:
      amount: 1
  products:
    Depotojil: 3