- type: reagent
  id: Punturil
  name: reagent-name-punturil
  group: Medicine
  desc: reagent-desc-punturil
  physicalDesc: reagent-physical-desc-fizzy
  flavor: fizzy
  color: "#b9bf93"
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:ModifyBleedAmount
        amount: -1
      - !type:HealthChange
        damage:
          types:
            Piercing: -2.5 # 10 per u
            Radiation: 0.05 # 0.2 per u, 3 for 15u
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 12
        damage:
          types:
            Blunt: 3 # 12 per u

- type: reagent
  id: Depotojil
  name: reagent-name-depotojil
  group: Narcotics
  desc: reagent-desc-depotojil
  physicalDesc: reagent-physical-desc-energizing
  flavor: sharp
  color: "#9A040E"
  metabolisms:
    Narcotic:
      metabolismRate: 1.0
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 1.3
        sprintSpeedModifier: 1.3
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 80 #please wait 3 minutes before using another stimpack
        damage:
          types:
            Poison: 1
      - !type:AdjustReagent
        conditions:
        - !type:ReagentThreshold
          reagent: ChloralHydrate
          min: 1
        reagent: ChloralHydrate
        amount: -10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3
        type: Remove
      - !type:ModifyKnockdown
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: StaminaModifier
        component: StaminaModifier
        time: 3
        type: Add
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Haloperidol
          max: 0.01
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Remove
    Medicine:
      metabolismRate: 1.0
      effects:
      - !type:ResetNarcolepsy
      - !type:SatiateHunger
        factor: 1
      - !type:SatiateThirst
        factor: 1
      - !type:HealthChange
        conditions:
        - !type:TotalDamage
          min: 70 # only heals when you're more dead than alive
        damage: # heals at the same rate as tricordrazine, doesn't heal poison because if you OD'd I'm not giving you a safety net
          groups:
            Burn: -1
            Brute: -1

- type: reagent
  id: Ferratid
  name: reagent-name-ferratid
  group: Medicine
  desc: reagent-desc-ferratid
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#215263"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -1.5
            Shock: -1.5
            Cold: -1.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10
        damage:
          types:
            Asphyxiation: 1
            Cold: 2
          groups:
            Brute: 0.5
      - !type:Jitter
        conditions:
        - !type:ReagentThreshold
          min: 10

- type: reagent
  id: Ferotohil
  name: reagent-name-ferotohil
  group: Medicine
  desc: reagent-desc-ferotohil
  physicalDesc: reagent-physical-desc-soothing
  flavor: medicine
  color: "#fcf7f9"
  metabolisms:
    Medicine:
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -2
          Toxin: -2
          Airloss: -2
          Brute: -2

- type: reagent
  id: Extraboril
  name: entity-name-extraboril
  group: Toxins
  desc: entity-name-extraboril
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#e0a5b9"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      effects:
        - !type:CauseInfectionDead
          conditions:
            - !type:ReagentThreshold
              min: 3