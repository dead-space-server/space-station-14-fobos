## Химмастер
- type: entity
  id: UnitologyChemMaster
  parent: ChemMaster
  name: Х!мМ#ст^р 3500
  description: Неизвестного происхождения химический манипулятор биологического класса с возможностью производства таблеток и бутылочек, но... Что-то в нём не так.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Structures/uni_mixer.rsi
    snapCardinals: true
    layers:
    - state: mixer_empty
    - state: mixer_screens
  - type: Icon
    sprite: _DeadSpace/Necromorfs/TheCircle/Structures/uni_mixer.rsi
    state: mixer_empty
    
## Консоль
- type: entity
  parent: ComputerComms
  id: UnitologyComputerComms
  name: консоль связи отряда "Круг"
  description: Эта штука заставит станцию трепещась от страха!
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm_syndie
    - map: ["computerLayerKeys"]
      state: syndie_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "NuclearOperative" ]]
  - type: CommunicationsConsole
    title: thecircle-name
    color: "#D70040"
    canShuttle: false
    global: true
    announceSentBy: false
    sound: /Audio/_DeadSpace/Necromorfs/TheCircle/console-sfx/unitology-alert.ogg
  - type: Computer
    board: SyndicateCommsComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#D70040"