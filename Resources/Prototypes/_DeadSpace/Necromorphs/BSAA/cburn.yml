# Настройки спавна
- type: randomHumanoidSettings
  id: BSAALeader
  parent: EventHumanoidERTZombieImmune
  components:
    - type: GhostRole
      name: Лидер Альянса Противодействия БиоТерроризму
      description: ghost-role-information-cburn-leader-description
      rules: ghost-role-information-nonantagonist-rules
      requirements:
        - !type:DepartmentTimeRequirement
          department: Medical
          time: 36000 # 10 hours
        - !type:DepartmentTimeRequirement
          department: Security
          time: 72000 # 20 hours
        - !type:DepartmentTimeRequirement
          department: Command
          time: 36000 # 10 hours
      raffle:
        settings: short
      job: BSAALeaderJob
    - type: RandomMetadata
      nameSegments:
      - NamesFirstERTLeader
      - NamesLastERT
      nameFormat: name-format-ert
    - type: ImmunNecroobelisk
    - type: IgnoreKudzu
    - type: Loadout
      prototypes: [ BSAALeaderGear ]

- type: randomHumanoidSettings
  id: BSAAFighter
  parent: EventHumanoidERTZombieImmune
  components:
    - type: GhostRole
      name: Боец Альянса Противодействия БиоТерроризму
      description: ghost-role-information-cburn-agent-description
      rules: ghost-role-information-nonantagonist-rules
      requirements:
        - !type:DepartmentTimeRequirement
          department: Security
          time: 50400 # 14 hours
      raffle:
        settings: short
      job: BSAAFighterJob
    - type: RandomMetadata
      nameSegments:
      - NamesFirstERT
      - NamesLastERT
      nameFormat: name-format-ert
    - type: ImmunNecroobelisk
    - type: Loadout
      prototypes: [ BSAAFighterGear ]

- type: randomHumanoidSettings
  id: BSAAMedic
  parent: EventHumanoidERTZombieImmune
  components:
    - type: GhostRole
      name: Медик Альянса Противодействия БиоТерроризму
      description: ghost-role-information-cburn-agent-description
      rules: ghost-role-information-nonantagonist-rules
      requirements:
        - !type:DepartmentTimeRequirement
          department: Medical
          time: 50400
        - !type:DepartmentTimeRequirement
          department: Security
          time: 50400 
      raffle:
        settings: short
      job: BSAAMedicJob
    - type: RandomMetadata
      nameSegments:
      - NamesFirstERT
      - NamesLastERT
      nameFormat: name-format-ert
    - type: ImmunNecroobelisk
    - type: Loadout
      prototypes: [ BSAAMedicGear ]