  - type: Sprite
    sprite: _DeadSpace/Sponsor/non_stop_smetana/hud.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: c-icon
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DeadSpace/Sponsor/non_stop_smetana/hud.rsi
