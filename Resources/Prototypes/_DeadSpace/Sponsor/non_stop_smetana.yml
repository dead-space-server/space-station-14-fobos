    canFoldInsideContainer: true
  - type: GroupExamine
  - type: FoldableClothing
    foldedEquippedPrefix: c
    foldedHeldPrefix: c
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}
  - type: ToggleableClothing
    clothingPrototype: ClothingEyesHudMedicalnon_stop_smetana1
    requiredSlot:
    - eyes
    slot: head
  - type: ContainerContainer
