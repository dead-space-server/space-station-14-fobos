# Закреплённые чертежи при крафте

- type: consoleCraft
  id: ResearchModifiedBackpack
  name: Модифицированный рюкзак научного специалиста
  item: ClothingBackpackRIGResearch
  time: 10
  requestItems:
  - itemProto: MediumCoreForModifiedBackpack
    amount: 1
    label: Среднее ядро модифицированного рюкзака
  minorItems:
  - StorageModule
  - SpeedModifierModuleResearch
  - DelayModifierModule

- type: consoleCraft
  id: EngineerModifiedBackpack
  name: Модифицированный рюкзак инженера
  item: ClothingBackpackRIGEngineer
  time: 10
  requestItems:
  - itemProto: DefaultCoreForModifiedBackpack
    amount: 1
    label: Обычное ядро модифицированного рюкзака
  - itemProto: PlastineOfEngineerRIG
    amount: 2
    label: Пластина для модифицированного рюкзака инженера
  - itemProto: HardsuitGirderLeg
    amount: 1
    label: Каркас ног скафандра
  - itemProto: HardsuitGirderTorso
    amount: 1
    label: Каркас торса скафандра
  minorItems:
  - StorageModule
  - OuterSuitMiniJet
  - DelayModifierModule
  - FireResistanceModuleEngineer
  - HeatResistanceModuleEngineer

- type: consoleCraft
  id: HardsuitMaxim
  name: Максимальный скафандр утилизатора
  item: ClothingOuterHardsuitMaxim
  time: 10
  requestItems:
  - itemProto: PlastineOfEngineerRIG
    amount: 2
    label: Пластина продвинутого скафандра
  - itemProto: HardsuitGirderLeg
    amount: 1
    label: Каркас ног скафандра
  - itemProto: HardsuitGirderTorso
    amount: 1
    label: Каркас торса скафандра
  minorItems:
  - PlusSpeedModule
  - PoisonResistanceModule
  - PNVModuleMaxim

- type: consoleCraft
  id: LecterCraft
  name: Лектер
  item: WeaponRifleLecter
  time: 10
  requestItems:
  - itemProto: ScrapFirelock3
    amount: 1
    label: Каркас Лектера
  - itemProto: MediumCoreForModifiedBackpack
    amount: 1
    label: Модуль Лектера
  minorItems:
  - MassSkope
  - EnhancedCoolingModule
  - SpeedBullet
  - ExtendedAmmoMag
  - OverchargeModule

# Рамдомные чертежи при крафте
# Если вы хотите чтобы был рамдомный предмет во время крафта у чертежа, ставьте не requestItems, а randomRequestItems, а после чего составляйте список.

- type: consoleCraft
  id: WeaponRifleAEKCraft
  name: AEK
  item: WeaponRifleAEK
  time: 10
  randomRequestItems:
  - items:
      - ScrapFirelock3
      - MediumCoreForModifiedBackpack
    amount: 1
    label: "Металл (случайный)"
  minorItems:
  - EnhancedCoolingModule
  - OverchargeModule
  - MassSkope
