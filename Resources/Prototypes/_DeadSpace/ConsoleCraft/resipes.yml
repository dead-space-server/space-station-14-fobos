# Закреплённые чертежи при крафте

- type: consoleCraft
  id: ResearchModifiedBackpack
  name: Модифицированный рюкзак научного специалиста
  item: ClothingBackpackRIGResearch
  time: 10
  requestItems:
  - itemProto: MediumCoreForModifiedBackpack
    amount: 1
    label: Среднее ядро модифицированного рюкзака
  minorItems:
  - StorageModule
  - SpeedModifierModuleResearch
  - DelayModifierModule

- type: consoleCraft
  id: LecterCraft
  name: Лектер
  item: WeaponRifleLecter
  time: 10
  requestItems:
  - itemProto: ScrapFirelock3
    amount: 1
    label: Каркас Лектера
  - itemProto: MediumCoreForModifiedBackpack
    amount: 1
    label: Модуль Лектера
  minorItems:
  - MassSkope
