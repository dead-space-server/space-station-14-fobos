- type: entity
  categories: [ HideSpawnMenu ]
  id: MiniDragonsFireBreathGun
  name: dragon's lung
  description: For dragon's breathing.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: FireballBullet
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 25 

- type: entity
  id: ProjectileMiniDragonToxic
  parent: BulletAcid
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    deleteOnCollide: true
    onlyCollideWhenShot: true
    damage:
      types:
        Caustic: 8

- type: entity
  categories: [ HideSpawnMenu ]
  id: MiniDragonsToxicBreathGun
