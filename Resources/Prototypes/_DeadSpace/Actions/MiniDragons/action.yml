- type: entity
  parent: BaseAction
  id: ActionMiniDragonsToxicBreath
  name: "[color=green]Плевок кислотой[/color]"
  description: Вы плюёте своей кислотой в вперёд, нанося кислотные повреждение.
  components:
  - type: Action
    # TODO: actual sprite and iconOn
    icon: { sprite : Objects/Weapons/Guns/Projectiles/xeno_toxic.rsi, state: xeno_toxic }
    itemIconStyle: BigAction
    priority: 2
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ActionGunShootEvent

- type: entity
  id: MiniDragonsProjectileIcicle
  parent: BaseBullet
  name: icicle
  description: Brrrrr.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/ice_anom.rsi
  - type: Projectile
    damage:
      types:
        Cold: 10

- type: entity
  parent: BaseAction
  id: ActionMiniDragonsIceBreath
  name: "[color=blue]Плевок ледышкой[/color]"
