- type: entity
  id: WeaponryTechFabERT
  parent: BaseLatheLube
  name: оружейный техфаб КСО
  description: С него так и веет жаром.
  components:
  - type: Sprite
    sprite: _DeadSpace/Ert/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: sec
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: WeaponryTechFabCircuitboardERT
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - BSAAAmmoStatic
    - SecurityAmmo
    - SecurityAmmoStatic
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient

- type: entity
  id: WeaponryTechFabCircuitboardERT
  parent: BaseMachineCircuitboard
  name: оружейный ТехФаб КСО (машинная плата)
  description: Печатная плата оружейного ТехФаба.
  components:
  - type: MachineBoard
    prototype: WeaponryTechFabERT
    stackRequirements:
      Manipulator: 4
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker