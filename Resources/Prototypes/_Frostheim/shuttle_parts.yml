- type: entity
  id: FrostheimBrokenThrusterBase
  parent: BaseStructureDynamic
  name: сломанный двигатель
  abstract: true
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        density: 60
        mask:
        - MachineMask
        layer: []
  - type: Sprite
    sprite: Structures/Shuttles/old_thruster.rsi
    state: base
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: FrostheimBrokenThruster
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Повреждённый маневровый двигатель. Корпус проржавел. Используйте сварку для начала ремонта.
  components:
  - type: Construction
    graph: FrostheimThrusterRepair
    node: broken
    defaultTarget: repaired

- type: entity
  id: FrostheimBrokenThrusterGutted
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Корпус заварен. Нужно проложить проводку — вставьте кабели.
  components:
  - type: Construction
    graph: FrostheimThrusterRepair
    node: gutted
    defaultTarget: repaired

- type: entity
  id: FrostheimBrokenThrusterWired
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Проводка на месте. Осталось закрутить панель отвёрткой.
  components:
  - type: Construction
    graph: FrostheimThrusterRepair
    node: wired
    defaultTarget: repaired

