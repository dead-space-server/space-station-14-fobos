- type: constructionGraph
  id: FrostheimThrusterRepair
  start: broken
  graph:
    - node: broken
      entity: FrostheimBrokenThruster
      edges:
        - to: gutted
          steps:
            - tool: Welding
              doAfter: 5
    - node: gutted
      entity: FrostheimBrokenThrusterGutted
      edges:
        - to: wired
          steps:
            - material: Cable
              amount: 5
              doAfter: 3
    - node: wired
      entity: FrostheimBrokenThrusterWired
      edges:
        - to: repaired
          steps:
            - tool: Screwing
              doAfter: 3
    - node: repaired
      entity: ThrusterUnanchored

- type: constructionGraph
  id: FrostheimGyroscopeRepair
  start: broken
  graph:
    - node: broken
      entity: FrostheimBrokenGyroscope
      edges:
        - to: gutted
          steps:
            - tool: Welding
              doAfter: 5
    - node: gutted
      entity: FrostheimBrokenGyroscopeGutted
      edges:
        - to: wired
          steps:
            - material: Cable
              amount: 5
              doAfter: 3
    - node: wired
      entity: FrostheimBrokenGyroscopeWired
      edges:
        - to: repaired
          steps:
            - tool: Screwing
              doAfter: 3
    - node: repaired
      entity: GyroscopeUnanchored

- type: entity
  id: FrostheimBrokenThrusterBase
  parent: BaseStructureDynamic
  name: сломанный двигатель
  abstract: true
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        density: 60
        mask:
        - MachineMask
        layer: []
  - type: Sprite
    sprite: Structures/Shuttles/old_thruster.rsi
    state: base
  - type: FrostheimBrokenPart
    partType: Thruster
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: FrostheimBrokenThruster
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Повреждённый маневровый двигатель. Корпус проржавел. Используйте сварку для начала ремонта.
  components:
  - type: Construction
    graph: FrostheimThrusterRepair
    node: broken
    deconstructionTarget: null
    defaultTarget: repaired

- type: entity
  id: FrostheimBrokenThrusterGutted
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Корпус заварен. Нужно проложить проводку — вставьте кабели.
  components:
  - type: Construction
    graph: FrostheimThrusterRepair
    node: gutted
    deconstructionTarget: null
    defaultTarget: repaired

- type: entity
  id: FrostheimBrokenThrusterWired
  parent: FrostheimBrokenThrusterBase
  name: сломанный двигатель
  description: Проводка на месте. Осталось закрутить панель отвёрткой.
  components:
