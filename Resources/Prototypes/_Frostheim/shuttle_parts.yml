- type: entity
  id: FrostheimLootSpawnAny
  parent: MarkerBase
  name: frostheim loot spawn
  components:
  - type: FrostheimLootSpawn
  - type: Sprite
    state: red

- type: entity
  id: FrostheimLootSpawnThruster
  parent: MarkerBase
  name: frostheim loot spawn (thruster)
  components:
  - type: FrostheimLootSpawn
    lootType: Thruster
  - type: Sprite
    state: red

- type: entity
  id: FrostheimLootSpawnGyroscope
  parent: MarkerBase
  name: frostheim loot spawn (gyroscope)
