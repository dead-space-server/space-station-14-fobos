- type: entity
  id: supermatter
  name: Supermatter
  description: A strangely translucent and iridescent crystal.
  placement:
    mode: SnapgridCenter
  components:
  - type: Supermatter
    whitelist:
      tags:
      - EmitterBolt
      components:
      - Body
      - Item
  - type: RadiationSource
  - type: AmbientSound
    range: 5
    volume: 50
    sound:
      path: /Audio/_Frostheim/Supermatter/calm.ogg
  - type: Physics
    bodyType: Static
  - type: Speech
    speechSounds: Pai
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        mask:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        - InteractImpassable
        - Opaque
        layer:
        - MidImpassable
        - HighImpassable
        - BulletImpassable
        - InteractImpassable
  - type: Transform
    anchored: true
    noRot: true
  - type: CollisionWake
    enabled: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Frostheim/supermatter.rsi
    state: supermatter
  - type: Icon
    sprite: _Frostheim/supermatter.rsi
    state: supermatter
  - type: PointLight
    enabled: true
    radius: 10
    energy: 5
    color: "#d9ce00"
  - type: Explosive
    explosionType: Supermatter
    maxIntensity: 10000
    intensitySlope: 10
    totalIntensity: 10000

- type: entity
  parent: BookBase
  id: BookSupermatter
  name: supermatter operations manual
  description: A worn manual with radiation burns on the cover. The previous owner's name has been scratched out.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#3d3a00"
    - state: decor_wingette
      color: "#2a2800"
    - state: icon_glow
      color: "#d9ce00"
    - state: icon_diamond
      color: "#d9ce00"
  - type: Paper
    content: book-text-supermatter
    editingDisabled: true

- type: Tag
  id: SMImmune

- type: explosion
  id: Supermatter
  damagePerIntensity:
    types:
      Radiation: 5
      Heat: 4
      Blunt: 3
      Piercing: 3
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  lightColor: Yellow
  fireColor: Green
  texturePath: /Textures/Effects/fire_greyscale.rsi
  fireStates: 3
