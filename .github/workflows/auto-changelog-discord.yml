name: Send Changelog to Discord

on:
  pull_request_target:
    types: [closed]

jobs:
  send-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR details
        id: extract
        run: |
          BODY=$(printf '%s' "${{ github.event.pull_request.body }}" | base64 -w0)
          echo "DESCRIPTION_B64=$BODY" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "REPO=${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Parse PR description and build message
        id: parse
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
          PR_NUMBER: ${{ steps.extract.outputs.PR_NUMBER }}
          AUTHOR: ${{ steps.extract.outputs.AUTHOR }}
          REPO: ${{ steps.extract.outputs.REPO }}
        run: |
          python <<'EOF'
          import json, re, os, base64
          from datetime import datetime, timezone

          desc_b64 = os.environ.get("DESCRIPTION_B64", "")
          desc = base64.b64decode(desc_b64).decode("utf-8", errors="replace")
          pr_num = os.environ.get("PR_NUMBER", "")
          author = os.environ.get("AUTHOR", "")
          repo = os.environ.get("REPO", "")

          desc = re.sub(r'<!--.*?-->', '', desc, flags=re.DOTALL)

          sections = {
              "Добавлено": "🟢 Добавлено",
              "Удалено": "🔴 Удалено",
              "Изменено": "🟡 Изменено",
              "Исправлено": "🔧 Исправлено"
          }
          changes = []

          for title, emoji_title in sections.items():
              pattern = rf"-\s*{title}:\s*(.*?)(?=\n-[^\n]*:|$)"
              for block in re.findall(pattern, desc, flags=re.DOTALL):
                  lines = [
                      re.sub(r'^-\s*', '', line.strip())
                      for line in block.splitlines()
                      if line.strip()
                  ]
                  if lines:
                      changes.append(f"{emoji_title}:\n- " + "\n- ".join(lines))

          # Формируем сообщение
          if changes:
              message = "\n".join(changes)
          else:
              message = "Изменения не указаны."

          payload = {
              "username": "Changelog Bot",
              "avatar_url": "https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d34942/images/features/emojis/emoji.png",
              "embeds": [
                  {
                      "color": 3300375,  # Синий
                      "title": f"Обновлён Changelog (PR #{pr_num})",
                      "url": f"https://github.com/{repo}/pull/{pr_num}",
                      "description": message,
                      "fields": [
                          {
                              "name": "Автор",
                              "value": f"@{author}",
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": f"Changelog · {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}"
                      }
                  }
              ]
          }

          print(json.dumps(payload))
          EOF

      - name: Send to Discord
        env:
          PAYLOAD: ${{ steps.parse.outputs.result }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
