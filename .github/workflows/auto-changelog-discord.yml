name: Send Changelog to Discord

on:
  pull_request_target:
    types: [closed]

jobs:
  send-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR details
        id: extract
        run: |
          BODY=$(printf '%s' "${{ github.event.pull_request.body }}" | base64 -w0)
          echo "DESCRIPTION_B64=$BODY" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "REPO=${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Parse & build JSON
        id: parse
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
          PR_NUMBER: ${{ steps.extract.outputs.PR_NUMBER }}
          AUTHOR: ${{ steps.extract.outputs.AUTHOR }}
          REPO: ${{ steps.extract.outputs.REPO }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          DESC=$(echo "$DESCRIPTION_B64" | base64 -d)
          DESC_CLEAN=$(echo "$DESC" | sed 's/<!--.*-->//g')

          ADDED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Добавлено:).*' || echo "")
          REMOVED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Удалено:).*' || echo "")
          CHANGED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Изменено:).*' || echo "")
          FIXED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Исправлено:).*' || echo "")

          MESSAGE=""
          [[ -n "$ADDED" ]] && MESSAGE+="🟢 **Добавлено**:\n$ADDED\n\n"
          [[ -n "$REMOVED" ]] && MESSAGE+="🔴 **Удалено**:\n$REMOVED\n\n"
          [[ -n "$CHANGED" ]] && MESSAGE+="🟡 **Изменено**:\n$CHANGED\n\n"
          [[ -n "$FIXED" ]] && MESSAGE+="🔧 **Исправлено**:\n$FIXED\n"
          [[ -z "$MESSAGE" ]] && MESSAGE="Изменения не указаны."

          PAYLOAD=$(jq -n \
            --arg title "Обновлён Changelog (PR #$PR_NUMBER)" \
            --arg url "https://github.com/$REPO/pull/$PR_NUMBER" \
            --arg desc "$MESSAGE" \
            --arg author "@$AUTHOR" \
            --arg footer "Changelog · $(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            '{
              "username": "Changelog Bot",
              "avatar_url": "https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d34942/images/features/emojis/emoji.png",
              "embeds": [
                {
                  "color": 3300375,
                  "title": $title,
                  "url": $url,
                  "description": $desc,
                  "fields": [
                    {
                      "name": "Автор",
                      "value": $author,
                      "inline": true
                    }
                  ],
                  "footer": {
                    "text": $footer
                  }
                }
              ]
            }')

          echo "$PAYLOAD" > /tmp/discord_payload.json

          echo "PAYLOAD_FILE=/tmp/discord_payload.json" >> $GITHUB_OUTPUT


      - name: Send to Discord
        env:
          PAYLOAD_FILE: ${{ steps.parse.outputs.PAYLOAD_FILE }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat "$PAYLOAD_FILE")
          echo "Payload: $PAYLOAD"

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" \
            --fail \
            --silent \
            --show-error
