name: "Changelog: Send discord webhook"

on:
  pull_request_target:
    types: [closed]

jobs:
  send-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR details
        id: extract
        run: |
          BODY=$(printf '%s' "${{ github.event.pull_request.body }}" | base64 -w0)
          echo "DESCRIPTION_B64=$BODY" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "REPO=${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Check commented
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
        run: |
          python <<'EOF'
          import re, os
          import base64
          desc_b64 = os.environ.get("DESCRIPTION_B64", "")
          desc = base64.b64decode(desc_b64).decode("utf-8", errors="replace")

          desc = re.sub(r'<!--.*?-->', '', desc, flags=re.DOTALL)
          if ":cl:" not in desc:
              print("Skip (:cl)")
              exit(0)
          EOF

      - name: Parse PR and build JSON with jq
        id: parse
        env:
          DESCRIPTION_B64: ${{ steps.extract.outputs.DESCRIPTION_B64 }}
          PR_NUMBER: ${{ steps.extract.outputs.PR_NUMBER }}
          AUTHOR: ${{ steps.extract.outputs.AUTHOR }}
          REPO: ${{ steps.extract.outputs.REPO }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          DESC=$(echo "$DESCRIPTION_B64" | base64 -d)
          DESC_CLEAN=$(echo "$DESC" | sed 's/<!--.*-->//g')

          ADDED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Добавлено:).*' || echo "")
          REMOVED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Удалено:).*' || echo "")
          CHANGED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Изменено:).*' || echo "")
          FIXED=$(echo "$DESC_CLEAN" | grep -oP '(?<=- Исправлено:).*' || echo "")

          # Преобразуем \n в реальные переносы строк для каждого поля
          ADDED=$(echo -e "$ADDED")
          REMOVED=$(echo -e "$REMOVED")
          CHANGED=$(echo -e "$CHANGED")
          FIXED=$(echo -e "$FIXED")

          # Если изменений нет — выходим без отправки
          if [[ -z "$ADDED" && -z "$REMOVED" && -z "$CHANGED" && -z "$FIXED" ]]; then
            echo "No changes found. Skipping Discord notification."
            exit 0
          fi

          # Создаём JSON через jq с полями (fields) для каждого типа изменений
          PAYLOAD=$(jq -n \
            --arg title "Изменение (PR #$PR_NUMBER)" \
            --arg url "https://github.com/$REPO/pull/$PR_NUMBER" \
            --arg author "$AUTHOR" \
            --arg footer "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --arg added "$ADDED" \
            --arg removed "$REMOVED" \
            --arg changed "$CHANGED" \
            --arg fixed "$FIXED" \
            '{
              "username": "Капибарка МК-Изменения",
              "embeds": [
                {
                  "color": 3300375,
                  "title": $title,
                  "url": $url,
                  "fields": [
                    { "name": "🆕 Добавлено:", "value": $added, "inline": false },
                    { "name": "❌ Удалено:", "value": $removed, "inline": false },
                    { "name": "⚒️ Изменено:", "value": $changed, "inline": false },
                    { "name": "🐛 Исправлено:", "value": $fixed, "inline": false },
                    { "name": "👤 Автор:", "value": $author, "inline": false }
                  ],
                  "footer": {
                    "text": $footer
                  }
                }
              ]
            }')

          echo "$PAYLOAD" > /tmp/discord_payload.json
          echo "PAYLOAD_FILE=/tmp/discord_payload.json" >> $GITHUB_OUTPUT

      - name: Send to Discord
        if: steps.parse.outcome == 'success' && steps.parse.outputs.PAYLOAD_FILE != ''
        env:
          PAYLOAD_FILE: ${{ steps.parse.outputs.PAYLOAD_FILE }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat "$PAYLOAD_FILE")

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" \
            --fail \
            --silent \
            --show-error
